
name: router

# Copied from foreman/templates/app-repo. Set `project` to the slug in foreman.
# issue_comment runs on the default branch, so the router script is not taken from the PR.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

jobs:
  router:
    if: github.event.issue.pull_request
    uses: e-bushi/Foreman/.github/workflows/router.yml@main
    with:
      project: norma
      foreman_ref: main
    secrets: inherit


