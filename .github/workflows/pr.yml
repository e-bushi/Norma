# PR gate from VERIFICATION.md section 1.
# Runs on Chris's Mac. Register the self-hosted runner with the default
# labels self-hosted, macOS, and ARM64. Do not remove them.
name: PR

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: norma-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build:
    name: Build
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: bash scripts/ci.sh build
      - name: Delete DerivedData
        if: always()
        run: rm -rf "/tmp/norma-derived-${{ github.run_id }}-${{ github.job }}"

  unit-tests:
    name: Unit tests
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests
        run: bash scripts/ci.sh unit-tests
      - name: Delete DerivedData
        if: always()
        run: rm -rf "/tmp/norma-derived-${{ github.run_id }}-${{ github.job }}"

  style:
    name: Style
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: SwiftLint and swift-format
        run: bash scripts/ci.sh style
      - name: Delete DerivedData
        if: always()
        run: rm -rf "/tmp/norma-derived-${{ github.run_id }}-${{ github.job }}"

  screenshot:
    name: Screenshot
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Home screen, dark, default Dynamic Type, iPhone 17
        run: bash scripts/ci.sh screenshot
      - name: Delete DerivedData
        if: always()
        run: rm -rf "/tmp/norma-derived-${{ github.run_id }}-${{ github.job }}"
