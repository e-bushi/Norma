# Style is the only GitHub-hosted app check. Build, unit tests, screenshots,
# and smoke run on Chris's Mac through scripts/ci.sh. See VERIFICATION.md.
name: PR

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: norma-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SwiftLint 0.61.0 and swift-format 6.2.3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            gnupg2 \
            libc6-dev \
            libcurl4-openssl-dev \
            libedit2 \
            libgcc-13-dev \
            libpython3-dev \
            libsqlite3-0 \
            libstdc++-13-dev \
            libxml2-dev \
            libz3-dev \
            pkg-config \
            tzdata \
            unzip \
            zlib1g-dev
          curl -fL --retry 3 -o /tmp/swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.61.0/swiftlint_linux_amd64.zip
          rm -rf /tmp/swiftlint
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint
          sudo install -m 755 "$(find /tmp/swiftlint -type f -name swiftlint -print -quit)" /usr/local/bin/swiftlint
          test "$(swiftlint version)" = "0.61.0"
          curl -fL --retry 3 -o /tmp/swift.tar.gz \
            https://download.swift.org/swift-6.2.3-release/ubuntu2404/swift-6.2.3-RELEASE/swift-6.2.3-RELEASE-ubuntu24.04.tar.gz
          sudo tar -xzf /tmp/swift.tar.gz -C /opt
          tool=/opt/swift-6.2.3-RELEASE-ubuntu24.04/usr/bin/swift-format
          test "$("$tool" --version)" = "6.2.3"
          echo "/opt/swift-6.2.3-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"
      - name: SwiftLint and swift-format
        run: |
          set -euo pipefail
          swiftlint lint --strict --config .swiftlint.yml
          mapfile -t sources < <(find Norma NormaTests NormaUITests -name '*.swift' -not -path '*/Generated/*')
          swift-format lint --strict --configuration .swift-format "${sources[@]}"
