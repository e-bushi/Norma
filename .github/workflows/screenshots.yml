# Full screenshot matrix and the XCUITest smoke flow.
# VERIFICATION.md section 3: on merge to main, and nightly.
# Same runner labels as the PR gate: self-hosted, macOS, ARM64.
name: Screenshots

on:
  push:
    branches: [main]
  schedule:
    # 07:00 UTC, 3:00am Eastern.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: norma-screenshots
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  matrix:
    name: Screenshot matrix
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dark, default and accessibility, small and large
        run: bash scripts/ci.sh screenshot-matrix
      - name: Smoke test
        run: bash scripts/ci.sh smoke
      - name: Delete DerivedData
        if: always()
        run: rm -rf "/tmp/norma-derived-${{ github.run_id }}-${{ github.job }}"
